[workspace]
resolver = "2"
members = [
    "crates/uvie-core",
    "crates/uvie-win",
    "crates/uvie-winui",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uvie-project/uvie-win"

[workspace.dependencies]
uvie = { git = "https://github.com/uvie-project/uvie-rs", tag = "v2.8.1" }
uvie-core = { path = "crates/uvie-core" }
uvie-winui = { path = "crates/uvie-winui" }
windows = "0.62"
windows-core = "0.62"
windows-link = "0.2"
windows-bindgen = "0.62.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
